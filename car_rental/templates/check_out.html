{% extends "base.html" %}
{% block title %}Check-Out Car{% endblock %}
{% block content %}
<div class="card">
  <h2>Check-Out: {{ car.brand }} {{ car.model }}</h2>
  <p>Customer: {{ user.name }}</p>
  <form method="post">
    <button type="submit" class="btn success">Confirm Check-Out</button>
  </form>
</div>
{% endblock %}
