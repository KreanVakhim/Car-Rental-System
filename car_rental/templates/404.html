{% extends "base.html" %}
{% block title %}Page Not Found{% endblock %}
{% block content %}
<div class="container text-center py-5">
    <div class="mb-4">
        <h1 class="display-1 fw-bold text-danger">404</h1>
        <h2 class="display-5">Oops! Page Not Found</h2>
        <p class="lead text-muted">The page you're looking for doesn't exist.</p>
    </div>
    <div class="mb-4">
        <img src="https://http.cat/404" alt="404 Cat" class="img-fluid rounded" style="max-height: 300px;">
    </div>
    <div>
        <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg px-4">
            Back to Home
        </a>
    </div>
</div>
{% endblock %}
