{% extends "base.html" %}
{% block title %}Edit Car{% endblock %}
{% block content %}
<div class="container mt-4">
    <h2>Edit Car</h2>
    <form method="POST" enctype="multipart/form-data">
        <input type="hidden" name="id" value="{{ car.id }}">
        <div class="mb-3"><input class="form-control" name="brand" value="{{ car.brand }}" required></div>
        <div class="mb-3"><input class="form-control" name="model" value="{{ car.model }}" required></div>
        <div class="mb-3"><input class="form-control" name="year" type="number" value="{{ car.year }}" required></div>
        <div class="mb-3"><input class="form-control" name="price_day" type="number" step="0.01" value="{{ car.price_day }}" required></div>
        <div class="mb-3"><input class="form-control" name="seats" type="number" value="{{ car.seats }}" required></div>
        <div class="mb-3">
            <label class="form-label">Current Photo</label><br>
            {% if car.image %}
                <img src="{{ url_for('uploaded_file', filename=car.image) }}" class="img-thumbnail" style="max-height:150px;">
            {% endif %}
            <input class="form-control mt-2" type="file" name="image" accept="image/*">
        </div>
        <button type="submit" class="btn btn-primary">Update Car</button>
    </form>
</div>
{% endblock %}
