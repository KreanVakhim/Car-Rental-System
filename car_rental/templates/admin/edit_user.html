{% extends "base.html" %}

{% block title %}Edit User - Admin{% endblock %}

{% block content %}
<div class="container" style="padding: 40px 0;">
    <div style="max-width: 600px; margin: 0 auto;">
        <h1 style="margin-bottom: 30px;">Edit User</h1>
        
        <div class="form-section">
            <form method="POST">
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" name="name" class="form-control" value="{{ user.name }}" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" value="{{ user.email }}" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Phone</label>
                    <input type="tel" name="phone" class="form-control" value="{{ user.phone }}" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Role</label>
                    <select name="role" class="form-control" required>
                        <option value="customer" {% if user.role=='customer' %}selected{% endif %}>Customer</option>
                        <option value="staff" {% if user.role=='staff' %}selected{% endif %}>Staff</option>
                        <option value="admin" {% if user.role=='admin' %}selected{% endif %}>Admin</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label class="form-label">New Password (Leave blank to keep current)</label>
                    <input type="password" name="password" class="form-control">
                </div>
                
                <div style="display: flex; gap: 15px; margin-top: 30px;">
                    <button type="submit" class="btn btn-primary">Update User</button>
                    <a href="{{ url_for('manage_users') }}" class="btn" style="background: #6c757d; color: white;">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
