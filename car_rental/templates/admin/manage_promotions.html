{% extends "base.html" %}
{% block title %}Manage Promotions{% endblock %}
{% block content %}
<br><br><br>
<div class="container mt-5">
    <h2>Manage Promotions</h2>
    <button class="btn btn-success mb-3" data-bs-toggle="modal" data-bs-target="#addPromoModal">Add Promotion</button>

    <div class="table-responsive">
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Code</th>
                    <th>Discount %</th>
                    <th>Valid From</th>
                    <th>Valid To</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for p in promotions %}
                <tr>
                    <td><strong>{{ p.code }}</strong></td>
                    <td>{{ p.discount_pct }}%</td>
                    <td>{{ p.valid_from }}</td>
                    <td>{{ p.valid_to }}</td>
                    <td>
                        <form method="POST" class="d-inline">
                            <input type="hidden" name="promo_id" value="{{ p.id }}">
                            <input type="hidden" name="action" value="delete">
                            <button class="btn btn-danger btn-sm" onclick="return confirm('Delete promotion?')">Delete</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

<!-- Add Promo Modal -->
<div class="modal fade" id="addPromoModal">
    <div class="modal-dialog">
        <form method="POST">
            <div class="modal-content">
                <div class="modal-header">
                    <h5>Add Promotion</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" name="action" value="add">
                    <div class="mb-3">
                        <label>Code</label>
                        <input type="text" name="code" class="form-control" placeholder="WELCOME20" required>
                    </div>
                    <div class="mb-3">
                        <label>Discount %</label>
                        <input type="number" name="discount_pct" min="1" max="100" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>Valid From</label>
                        <input type="date" name="valid_from" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>Valid To</label>
                        <input type="date" name="valid_to" class="form-control" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
