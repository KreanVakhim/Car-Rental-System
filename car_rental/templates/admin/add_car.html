{% extends "base.html" %}
{% block title %}Add Car{% endblock %}
{% block content %}

<div class="add-car-container">
    <div class="card">
        <div class="card-header">
            <h2>Add New Car</h2>
        </div>
        <div class="card-body">
            <form method="POST" enctype="multipart/form-data">
                <div class="mb-3">
                    <label class="form-label">Brand</label>
                    <input type="text" name="brand" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Model</label>
                    <input type="text" name="model" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Year</label>
                    <input type="number" name="year" class="form-control" min="1900" max="{{ current_year }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Price / Day</label>
                    <input type="number" step="0.01" name="price_day" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Seats</label>
                    <input type="number" name="seats" class="form-control" min="1" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Image</label>
                    <input type="file" name="image" class="form-control" accept=".png,.jpg,.jpeg,.gif">
                </div>
                <button type="submit" class="btn btn-primary">Add Car</button>
            </form>
        </div>
    </div>
</div>

{% endblock %}
