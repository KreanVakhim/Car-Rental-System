{% extends "base.html" %}

{% block title %}Edit Promotion - Admin{% endblock %}

{% block content %}
<div class="container" style="padding: 40px 0;">
    <div style="max-width: 600px; margin: 0 auto;">
        <h1 style="margin-bottom: 30px;">Edit Promotion</h1>
        
        <div class="form-section">
            <form method="POST">
                <div class="form-group">
                    <label class="form-label">Promo Code</label>
                    <input type="text" name="code" class="form-control" value="{{ promo.code }}" required style="text-transform: uppercase;">
                </div>
                
                <div class="form-group">
                    <label class="form-label">Discount Percentage</label>
                    <input type="number" name="discount_pct" class="form-control" value="{{ promo.discount_pct }}" min="1" max="100" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Valid From</label>
                    <input type="date" name="valid_from" class="form-control" value="{{ promo.valid_from }}" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Valid To</label>
                    <input type="date" name="valid_to" class="form-control" value="{{ promo.valid_to }}" required>
                </div>
                
                <div style="display: flex; gap: 15px; margin-top: 30px;">
                    <button type="submit" class="btn btn-primary">Update Promotion</button>
                    <a href="{{ url_for('manage_promotions') }}" class="btn" style="background: #6c757d; color: white;">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
