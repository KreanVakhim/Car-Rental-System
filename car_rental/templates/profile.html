{% extends "base.html" %}
{% block title %}My Profile{% endblock %}
{% block content %}

<br><br><br><br><br><br>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white text-center">
                    <div class="position-relative d-inline-block">
                        <img src="{{ url_for('profile_pic', filename=user.profile_pic or 'default.png') }}" 
                             alt="Profile" class="rounded-circle mb-3" width="120" height="120" style="object-fit: cover; border: 2px solid #fff;">
                        <i class="fas fa-camera position-absolute bottom-0 end-0 bg-primary text-white p-2 rounded-circle" style="font-size: 1.2rem;"></i>
                    </div>
                    <h3 class="mb-0">{{ user.name }}</h3>
                    <small class="text-light">{{ user.role|title }}</small>
                </div>
                <div class="card-body p-4">
                    <form method="POST" enctype="multipart/form-data">
                        <div class="text-center mb-4">
                            <label class="btn btn-outline-primary btn-sm">
                                <i class="fas fa-upload me-1"></i> Change Photo
                                <input type="file" name="profile_pic" class="d-none" accept="image/*" onchange="previewImage(event)">
                            </label>
                            <p class="text-muted small mt-2">Max 2MB • PNG, JPG, GIF</p>
                        </div>

                        <div class="text-center mb-4">
                            <img id="preview" src="{{ url_for('profile_pic', filename=user.profile_pic or 'default.png') }}" 
                                 class="rounded-circle" width="100" height="100" style="object-fit: cover; border: 3px solid #0d6efd;">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Full Name</label>
                            <input type="text" name="name" class="form-control" value="{{ user.name }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Email Address</label>
                            <input type="email" name="email" class="form-control" value="{{ user.email }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Phone Number</label>
                            <input type="text" name="phone" class="form-control" value="{{ user.phone }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted">Account Type</label>
                            <input type="text" class="form-control" value="{{ user.role|title }}" disabled>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="fas fa-save me-2"></i>Update Profile
                            </button>
                        </div>
                    </form>
                </div>
                <div class="card-footer text-center">
                    <small class="text-muted">
                        Member since {{ user.created_at.strftime('%B %Y') }}
                    </small>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function previewImage(event) {
    const preview = document.getElementById('preview');
    const file = event.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            preview.src = e.target.result;
        };
        reader.readAsDataURL(file);
        // Optional: Validate file size (e.g., max 2MB)
        if (file.size > 2 * 1024 * 1024) {
            alert("File size must be less than 2MB");
            preview.src = "{{ url_for('profile_pic', filename=user.profile_pic or 'default.png') }}";
            event.target.value = ''; // Clear the input
        }
    }
}
</script>
{% endblock %}
