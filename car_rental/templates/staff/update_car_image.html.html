{% extends "base.html" %}
{% block title %}Update Images – {{ car.brand }} {{ car.model }}{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2>Update Images: {{ car.brand }} {{ car.model }}</h2>

    <form method="POST" enctype="multipart/form-data">
        <div class="mb-3">
            <label>Upload New Images (replace all)</label>
            <input type="file" name="images" multiple accept="image/*" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary">Update Images</button>
        <a href="{{ url_for('cars_list') }}" class="btn btn-secondary">Cancel</a>
    </form>

    <hr>
    <h5>Current Image</h5>
    {% if car.image %}
        <img src="{{ url_for('uploaded_file', filename=car.image) }}" class="img-fluid rounded" style="max-height:300px;">
    {% else %}
        <p class="text-muted">No image</p>
    {% endif %}
</div>
{% endblock %}
