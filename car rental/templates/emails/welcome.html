{% extends "base.html" %}

{% block content %}
<div class="jumbotron text-center">
    <h2>សូមស្វាគមន៍, {{ session.username }}!</h2>
    <p>អ្នកអាច <a href="{{ url_for('cars') }}" class="btn btn-primary">មើលរថយន្ត</a> ឬ <a href="{{ url_for('dashboard') if session.role == 'admin' else '#' }}" class="btn btn-secondary">Dashboard</a>។</p>
    <p>ប្រព័ន្ធនេះជួយអ្នកជួលរថយន្តងាយស្រួល និងសុវត្ថិភាព។</p>
</div>
{% endblock %}
