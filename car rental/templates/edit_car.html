{% extends 'base.html' %}
{% block title %}Edit Car{% endblock %}
{% block css %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/add_car.css') }}">
{% endblock %}
{% block content %}
    <h1>Edit Car</h1>
    <form method="POST" enctype="multipart/form-data">
        <label for="brand">Brand:</label>
        <input type="text" id="brand" name="brand" value="{{ car[1] }}" required>
        <label for="model">Model:</label>
        <input type="text" id="model" name="model" value="{{ car[2] }}" required>
        <label for="price_per_day">Price per Day ($):</label>
        <input type="number" id="price_per_day" name="price_per_day" value="{{ car[3] }}" step="0.01" min="0" required>
        <label for="status">Status:</label>
        <select id="status" name="status" required>
            <option value="Available" {% if car[4] == 'Available' %}selected{% endif %}>Available</option>
            <option value="Rented" {% if car[4] == 'Rented' %}selected{% endif %}>Rented</option>
        </select>
        <label for="image">Car Image (JPG/PNG):</label>
        <input type="file" id="image" name="image" accept=".jpg,.jpeg,.png">
        <p>Current Image: {% if car[5] %}{{ car[5] }}{% else %}None{% endif %}</p>
        <button type="submit">Update Car</button>
    </form>
{% endblock %}
