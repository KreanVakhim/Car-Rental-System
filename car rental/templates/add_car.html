{% extends "base.html" %}
{% block title %}Add New Car{% endblock %}

{% block styles %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/add_car.css') }}">
{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-10 col-xl-8">
            <div class="add-car-card">
                <div class="card-header bg-primary text-white text-center">
                    <h2 class="mb-0">
                        <i class="fas fa-car-side me-2"></i>
                        Add New Car
                    </h2>
                </div>
                <div class="card-body p-4">
                    <form method="POST" enctype="multipart/form-data" class="add-car-form">
                        <div class="row g-3">
                            <!-- Brand & Model -->
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">
                                    <i class="fas fa-tag text-primary me-1"></i> Brand
                                </label>
                                <input type="text" 
                                       name="brand" 
                                       class="form-control form-control-lg" 
                                       placeholder="e.g. Toyota" 
                                       required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">
                                    <i class="fas fa-car text-primary me-1"></i> Model
                                </label>
                                <input type="text" 
                                       name="model" 
                                       class="form-control form-control-lg" 
                                       placeholder="e.g. Camry" 
                                       required>
                            </div>

                            <!-- Price & Status -->
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">
                                    <i class="fas fa-dollar-sign text-success me-1"></i> Price / Day
                                </label>
                                <input type="number" 
                                       name="price_per_day" 
                                       step="0.01" 
                                       min="0" 
                                       class="form-control form-control-lg" 
                                       placeholder="50.00" 
                                       required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">
                                    <i class="fas fa-info-circle text-info me-1"></i> Status
                                </label>
                                <select name="status" class="form-select form-control-lg">
                                    <option value="Available">Available</option>
                                    <option value="Maintenance">Maintenance</option>
                                    <option value="Booked">Booked</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">
                                    <i class="fas fa-calendar text-muted me-1"></i> Year
                                </label>
                                <input type="number" 
                                       name="year" 
                                       min="1900" 
                                       max="2100" 
                                       class="form-control form-control-lg" 
                                       placeholder="2023">
                            </div>

                            <!-- Fuel & Transmission -->
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">
                                    <i class="fas fa-gas-pump text-warning me-1"></i> Fuel Type
                                </label>
                                <input type="text" 
                                       name="fuel_type" 
                                       class="form-control form-control-lg" 
                                       placeholder="Petrol / Diesel / Electric">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">
                                    <i class="fas fa-cogs text-secondary me-1"></i> Transmission
                                </label>
                                <input type="text" 
                                       name="transmission" 
                                       class="form-control form-control-lg" 
                                       placeholder="Auto / Manual">
                            </div>

                            <!-- Image Upload -->
                            <div class="col-12">
                                <label class="form-label fw-semibold">
                                    <i class="fas fa-image text-success me-1"></i> Car Image
                                </label>
                                <input type="file" 
                                       name="image" 
                                       class="form-control form-control-lg file-input" 
                                       accept="image/*">
                                <div class="form-text text-muted">
                                    Recommended: 800x600px, JPG/PNG
                                </div>
                            </div>

                            <!-- Featured Checkbox -->
                            <div class="col-12">
                                <div class="form-check featured-check">
                                    <input type="checkbox" 
                                           name="featured" 
                                           class="form-check-input" 
                                           id="featured">
                                    <label class="form-check-label fw-semibold" for="featured">
                                        <i class="fas fa-star text-warning me-1"></i>
                                        Mark as Featured Car
                                    </label>
                                </div>
                            </div>

                            <!-- Submit -->
                            <div class="col-12 text-center mt-4">
                                <button type="submit" 
                                        class="btn btn-primary btn-lg save-car-btn">
                                    <i class="fas fa-save me-2"></i>
                                    Save Car
                                </button>
                                <a href="{{ url_for('admin_dashboard') }}" 
                                   class="btn btn-outline-secondary btn-lg ms-2">
                                    <i class="fas fa-times me-2"></i>
                                    Cancel
                                </a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
