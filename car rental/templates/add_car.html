<!DOCTYPE html>
<html>
<head>
    <title>Add Car</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <h2>Add New Car</h2>
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <div class="alert">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}
    <form method="POST" action="{{ url_for('add_car') }}" enctype="multipart/form-data">
        <label for="brand">Brand:</label>
        <input type="text" id="brand" name="brand" required><br>

        <label for="model">Model:</label>
        <input type="text" id="model" name="model" required><br>

        <label for="price_per_day">Price per Day ($):</label>
        <input type="number" id="price_per_day" name="price_per_day" step="0.01" required><br>

        <label for="status">Status:</label>
        <select id="status" name="status">
            <option value="Available">Available</option>
            <option value="Rented">Rented</option>
        </select><br>

        <label for="year">Year:</label>
        <input type="number" id="year" name="year" min="2000" max="2025" placeholder="e.g., 2023"><br>

        <label for="fuel_type">Fuel Type:</label>
        <select id="fuel_type" name="fuel_type">
            <option value="">Select Fuel</option>
            <option value="Petrol">Petrol</option>
            <option value="Diesel">Diesel</option>
            <option value="Electric">Electric</option>
            <option value="Hybrid">Hybrid</option>
        </select><br>

        <label for="transmission">Transmission:</label>
        <select id="transmission" name="transmission">
            <option value="">Select Transmission</option>
            <option value="Automatic">Automatic</option>
            <option value="Manual">Manual</option>
        </select><br>

        <label for="featured">Featured:</label>
        <input type="checkbox" id="featured" name="featured"><br>

        <label for="image">Upload Image:</label>
        <input type="file" id="image" name="image" accept=".png,.jpg,.jpeg,.gif"><br>

        <button type="submit">Add Car</button>
    </form>

    <a href="{{ url_for('admin_dashboard') }}">Back to Dashboard</a>
</body>
</html>
