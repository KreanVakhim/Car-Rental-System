{% extends "base.html" %}
{% block title %}{% if session.lang == 'km' %}ចុះឈ្មោះ{% else %}Register{% endif %}{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2 class="text-center mb-4">{% if session.lang == 'km' %}ចុះឈ្មោះ{% else %}Register{% endif %}</h2>
        <form method="POST" action="{{ url_for('register') }}">
            <div class="mb-3">
                <label class="form-label">{% if session.lang == 'km' %}ឈ្មោះអ្នកប្រើ{% else %}Username{% endif %}</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">{% if session.lang == 'km' %}អ៊ីមែល{% else %}Email{% endif %}</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">{% if session.lang == 'km' %}លេខទូរស័ព្ទ{% else %}Phone{% endif %}</label>
                <input type="text" name="phone" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">{% if session.lang == 'km' %}លេខសម្ងាត់{% else %}Password{% endif %}</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">{% if session.lang == 'km' %}ចុះឈ្មោះ{% else %}Register{% endif %}</button>
        </form>
    </div>
</div>
{% endblock %}
