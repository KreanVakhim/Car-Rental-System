{% extends "base.html" %}
{% block title %}ចុះឈ្មោះ{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{{ url_for('static', filename='css/register.css') }}">{% endblock %}
{% block content %}
<div class="register-form">
    <h2>ចុះឈ្មោះគណនីថ្មី</h2>
    <form method="POST" action="{{ url_for('register') }}">
        <input type="text" name="name" placeholder="ឈ្មោះ" required>
        <input type="email" name="email" placeholder="អ៊ីម៉ែល" required>
        <input type="password" name="password" placeholder="ពាក្យសម្ងាត់" required>
        <select name="user_type">
            <option value="customer">អតិថិជន</option>
            <option value="staff">បុគ្គលិក</option>
        </select>
        <button type="submit">ចុះឈ្មោះ</button>
    </form>
    <p><a href="{{ url_for('login') }}">មានគណនីរួចទេ? ចូល</a></p>
</div>
{% endblock %}
