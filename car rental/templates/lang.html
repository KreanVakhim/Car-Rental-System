{% extends "base.html" %}
{% block title %}Language{% endblock %}
{% block css %}<link rel="stylesheet" href="{{ url_for('static', filename='css/lang.css') }}">{% endblock %}
{% block content %}
    <h1>Select Language</h1>
    <form method="post">
        <button type="submit" name="lang" value="en" class="btn btn-primary">English</button>
        <button type="submit" name="lang" value="km" class="btn btn-primary">ខ្មែរ (Khmer)</button>
    </form>
    <p>Note: Bilingual support is a future enhancement.</p>
{% endblock %}
