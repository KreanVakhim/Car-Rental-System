{% extends "base.html" %}
{% block title %}{% if session.lang == 'km' %}ប្រវត្តិរូប{% else %}Profile{% endif %}{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2 class="text-center mb-4">{% if session.lang == 'km' %}ប្រវត្តិរូប{% else %}Profile{% endif %}</h2>
        <form method="POST" enctype="multipart/form-data">
            <div class="mb-3 text-center">
                {% if user.avatar %}
                    <img src="{{ url_for('static', filename='avatars/' + user.avatar) }}" class="avatar-img mb-3" alt="Avatar">
                {% else %}
                    <img src="https://via.placeholder.com/150" class="avatar-img mb-3" alt="Default Avatar">
                {% endif %}
                <input type="file" name="avatar" class="form-control" accept="image/*">
            </div>
            <div class="mb-3">
                <label class="form-label">{% if session.lang == 'km' %}ឈ្មោះអ្នកប្រើ{% else %}Username{% endif %}</label>
                <input type="text" class="form-control" value="{{ user.username }}" disabled>
            </div>
            <div class="mb-3">
                <label class="form-label">{% if session.lang == 'km' %}អ៊ីមែល{% else %}Email{% endif %}</label>
                <input type="email" name="email" class="form-control" value="{{ user.email }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">{% if session.lang == 'km' %}លេខទូរស័ព្ទ{% else %}Phone{% endif %}</label>
                <input type="text" name="phone" class="form-control" value="{{ user.phone or '' }}">
            </div>
            <button type="submit" class="btn btn-primary w-100">{% if session.lang == 'km' %}ធ្វើបច្ចុប្បន្នភាព{% else %}Update Profile{% endif %}</button>
        </form>
    </div>
</div>
{% endblock %}
